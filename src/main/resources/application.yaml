spring:
  application:
    name: telegram-app
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: update
    show-sql: true

telegram:
  bot:
    token: ${BOT_TOKEN}

jwt:
  secret: ${telegram.bot.token}
  life-time: 1800000