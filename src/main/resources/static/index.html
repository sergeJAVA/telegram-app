<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин одежды</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="header">
    <div class="header-left">
        <div class="logo">👗 Shop</div>
    </div>
    <div class="header-right">
        <div class="header-icon" id="profileIcon" title="Профиль">
            <i class="fas fa-user-circle"></i>
        </div>
        <div class="cart-icon-wrapper">
            <div class="header-icon" id="cartIcon" title="Корзина">
                <i class="fas fa-shopping-cart"></i>
            </div>
            <div class="cart-badge" id="cartBadge" style="display: none;">0</div>
        </div>
    </div>
</div>

<div class="container">
    <div id="userProfile" class="user-profile" style="display: none;">
        <div class="user-avatar">👤</div>
        <div class="user-details">
            <h3 id="userName">Имя пользователя</h3>
            <p id="userUsername">@username</p>
        </div>
    </div>

    <div class="banner">
        <h1>Добро пожаловать в наш магазин!</h1>
        <p>Лучшая коллекция одежды по доступным ценам</p>
    </div>

    <div>
        <h2 style="color: white; margin-bottom: 15px;">Категории</h2>
        <div class="categories" id="categories">
            <button class="category-btn active" data-category="all">Все товары</button>
            <button class="category-btn" data-category="shirts">Рубашки</button>
            <button class="category-btn" data-category="pants">Штаны</button>
            <button class="category-btn" data-category="dresses">Платья</button>
            <button class="category-btn" data-category="shoes">Обувь</button>
        </div>
    </div>

    <div id="productsContainer" class="products-grid">
        <!-- Товары загружаются здесь -->
    </div>

    <div id="emptyState" class="empty-state" style="display: none;">
        <i class="fas fa-shopping-bag"></i>
        <h3>Товаров не найдено</h3>
        <p>Попробуйте выбрать другую категорию</p>
    </div>
</div>

<script src="index.js?v=0.1"></script>

</body>
</html>
